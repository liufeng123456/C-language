# Disable framebuffer (optional)
d-i debian-installer/framebuffer boolean false

### Locale
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i localechooser/supported-locales multiselect en_US.UTF-8, zh_CN.UTF-8

### Networking
# Do not configure network (offline installs)
d-i netcfg/get_hostname string pve-server
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/confirm_static boolean true

### Allow unauthenticated packages (use with caution)
d-i debian-installer/allow_unauthenticated boolean true

### Accounts
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password 123456
d-i passwd/root-password-again password 123456

### Timezone
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

### Mirror (skip / no network)
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true

### Enable contrib/non-free
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect main

### Package selection (ensure cryptsetup in initramfs)
d-i pkgsel/include string openssh-server fio libpcap-dev jq qrencode net-tools sudo curl python3-pip zlib1g-dev libssl-dev gcc make salt-minion iptables proxmox-default-kernel docker-ce docker-ce-cli libtinfo5 cryptsetup-initramfs

### Partitioning: LUKS + LVM, /boot (ext4) unencrypted, / (ext4) encrypted
# Detect target disk robustly and set boot device
# Also install fdisk-udeb to ensure fdisk is available in d-i
# Note: list-devices is provided by the installer environment

d-i partman/early_command string \
  anna-install fdisk-udeb; \
  BOOT_DISK="$(list-devices disk | head -n1)"; \
  debconf-set partman-auto/disk "$BOOT_DISK"; \
  debconf-set grub-installer/bootdev "$BOOT_DISK"

# Crypto settings
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-crypto/passphrase string mfy@666888
d-i partman-crypto/passphrase-again string mfy@666888

# Remove old MD/LVM metadata
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Guided crypto + LVM with expert recipe
d-i partman-auto/method string crypto
d-i partman/confirm_no_swap boolean true
d-i partman-basicfilesystems/no_swap boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select boot-luks-lvm
d-i partman-auto-lvm/new_vg_name string vg0

d-i partman-auto/expert_recipe string \
  boot-luks-lvm :: \
    512 512 1024 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    1024 1024 -1 ext4 \
      $defaultignore{ } $lvmignore{ } \
      method{ crypto } \
      crypto_keysize{ 512 } \
      crypto_cipher{ aes-xts-plain64 } \
      crypto_name{ cryptroot } \
    . \
    1000 1000 -1 lvm \
      method{ lvm } device{ /dev/mapper/cryptroot } vg_name{ vg0 } \
    . \
    1000 1000 -1 ext4 \
      $lvmok{ } in_vg{ vg0 } lv_name{ root } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    .

# Confirm write
d-i partman/choose_partition select Finish partitioning and write changes to disk
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nochanges boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Task selection
tasksel tasksel/first multiselect standard
d-i pkgsel/upgrade select none
d-i pkgsel/language-packs multiselect en, zh
d-i pkgsel/update-policy select none

popularity-contest popularity-contest/participate boolean false

### Late command: add keyfile and configure crypttab/initramfs
d-i preseed/late_command string \
  in-target sh -c ' \
    set -e; \
    dd if=/dev/urandom of=/etc/luks-keyfile bs=512 count=4; \
    chmod 0400 /etc/luks-keyfile; chown root:root /etc/luks-keyfile; \
    CRYPT_DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -n1); \
    [ -n "$CRYPT_DEV" ]; \
    UUID=$(blkid -s UUID -o value "$CRYPT_DEV"); \
    echo "cryptroot UUID=$UUID /etc/luks-keyfile luks,discard" > /etc/crypttab; \
    echo "mfy@666888" | cryptsetup luksAddKey "$CRYPT_DEV" /etc/luks-keyfile; \
    mkdir -p /etc/cryptsetup-initramfs; \
    printf "%s\n" "CRYPTSETUP=y" "KEYFILE_PATTERN=/etc/luks-keyfile" > /etc/cryptsetup-initramfs/conf-hook; \
    update-initramfs -u -k all; \
  ' ; \
  cp -rf /cdrom/post_install/* /target/root/ || true ; \
  in-target bash /root/software/entry.sh || true

# Reboot automatically
d-i finish-install/reboot_in_progress note
